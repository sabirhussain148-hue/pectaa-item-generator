<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PECTAA AI Powered Item Generator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">
<style>
:root{
  --bg:#f3f1ea; --bg2:#eae7dd; --card:#ffffff; --ink:#18231f; --muted:#5b6a63; --line:#dedbd0; --line2:#ece9df;
  --accent:#0f6b57; --accent2:#14866d; --accent-ink:#ffffff; --accent-soft:#e0f1ea;
  --warn:#8a5300; --warn-soft:#fbefd6; --bad:#a3302a; --bad-soft:#f9e3e0; --ok:#1c7a4f; --ok-soft:#e1f3e8;
  --k:#1d4ed8; --k-soft:#e4ecff; --u:#a15c00; --u-soft:#fdeed2; --a:#7c3aed; --a-soft:#efe6ff;
  --shadow:0 1px 2px rgba(20,35,30,.06),0 6px 18px rgba(20,35,30,.05);
  --sheet:#fff; --sheet-ink:#141414; --sheet-line:#b9b9b9;
  --ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Noto Naskh Arabic",serif;
  --en:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101714; --bg2:#17201c; --card:#18221d; --ink:#e7efe9; --muted:#9db0a5; --line:#2c3a33; --line2:#223029;
  --accent:#4fc19c; --accent2:#6fd3b1; --accent-ink:#08201a; --accent-soft:#1b3a2f;
  --warn:#e8b567; --warn-soft:#3a2d14; --bad:#ef8a83; --bad-soft:#3b1f1d; --ok:#6fd3a0; --ok-soft:#173326;
  --k:#8fb2ff; --k-soft:#1c2a4d; --u:#f0b45a; --u-soft:#3a2b10; --a:#c4a3ff; --a-soft:#2d2250;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101714; --bg2:#17201c; --card:#18221d; --ink:#e7efe9; --muted:#9db0a5; --line:#2c3a33; --line2:#223029;
  --accent:#4fc19c; --accent2:#6fd3b1; --accent-ink:#08201a; --accent-soft:#1b3a2f;
  --warn:#e8b567; --warn-soft:#3a2d14; --bad:#ef8a83; --bad-soft:#3b1f1d; --ok:#6fd3a0; --ok-soft:#173326;
  --k:#8fb2ff; --k-soft:#1c2a4d; --u:#f0b45a; --u-soft:#3a2b10; --a:#c4a3ff; --a-soft:#2d2250;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--en);font-size:15px;line-height:1.5;padding-block:0 80px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.ur{font-family:var(--ur);direction:rtl;line-height:2.1}
button{font-family:inherit}
.hero{padding:26px 0 6px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between}
.hero h1{margin:0;font-size:30px;letter-spacing:-.02em;font-weight:700}
.hero p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:560px}
.badge-demo{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:5px 12px}
.stepper{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:10px 0;margin:0 -2px;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.st{flex:1 0 auto;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s}
.st:hover{border-color:var(--accent)}
.st .c{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--bg2);color:var(--muted);flex:none}
.st.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.st.done .c{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;min-width:0;scroll-margin-top:70px}
.card.locked{opacity:.55}
.ch{width:100%;display:flex;align-items:center;gap:12px;background:none;border:none;color:inherit;padding:16px 18px;cursor:pointer;text-align:start}
.ch .c{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--accent);color:var(--accent-ink);flex:none}
.card.locked .ch .c{background:var(--line);color:var(--muted)}
.ch .t{font-size:17px;font-weight:700;letter-spacing:-.01em}
.ch .s{font-size:13px;color:var(--muted);margin-inline-start:auto;text-align:end;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:48%}
.ch .chev{color:var(--muted);transition:.2s;flex:none}
.card.open .ch .chev{transform:rotate(90deg)}
.cb{padding:2px 18px 18px;display:flex;flex-direction:column;gap:14px;min-width:0;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;background:var(--bg2);transition:.15s;cursor:pointer;position:relative}
.drop.hot,.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop b{font-size:15px}.drop small{color:var(--muted)}
.drop .ic{font-size:26px;line-height:1}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;border:1px solid var(--line);color:var(--muted);background:var(--card);white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.pill.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.pill.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.pill.k{color:var(--k);background:var(--k-soft);border-color:transparent}
.pill.u{color:var(--u);background:var(--u-soft);border-color:transparent}
.pill.a{color:var(--a);background:var(--a-soft);border-color:transparent}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.btn{border:none;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14.5px;border-radius:10px;padding:10px 18px;cursor:pointer;min-height:42px;transition:.15s;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.sm{font-size:13px;padding:6px 11px;min-height:34px;border-radius:8px}
.btn.big{font-size:16px;padding:13px 24px;min-height:50px;border-radius:12px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.lnk{background:none;border:none;color:var(--accent);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:4px 2px}
.lnk:hover{text-decoration:underline}
.note{font-size:13px;color:var(--muted);line-height:1.6}
.msg{font-size:13.5px;border-radius:10px;padding:10px 13px;background:var(--warn-soft);color:var(--warn);line-height:1.6}
.msg.ok{background:var(--ok-soft);color:var(--ok)}.msg.bad{background:var(--bad-soft);color:var(--bad)}.msg.info{background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;background:var(--bg2);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:none;background:none;color:var(--ink);font-weight:600;font-size:13.5px;padding:8px 14px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:var(--shadow);color:var(--accent)}
.seg button small{color:var(--muted);font-weight:500;margin-inline-start:4px}
input.txt,select,textarea.txt{font:inherit;font-size:14px;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);min-height:38px;max-width:100%}
input.txt:focus,select:focus,textarea.txt:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.lb{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px;font-weight:500}
.tbl{overflow-x:auto;border:1px solid var(--line2);border-radius:12px}
table.al{border-collapse:collapse;width:100%;min-width:560px;font-size:13.5px}
.al th,.al td{padding:8px 10px;border-bottom:1px solid var(--line2);text-align:start}
.al th{color:var(--muted);font-weight:600;font-size:12px;background:var(--bg2);text-transform:uppercase;letter-spacing:.04em}
.al tr:last-child td,.al tr:last-child th{border-bottom:none}
.al td.n{text-align:center;white-space:nowrap}.al th.n{text-align:center}
.al tfoot th,.al tr.tot th{background:var(--bg2);color:var(--ink);text-transform:none;font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat{background:var(--bg2);border-radius:12px;padding:10px 14px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}.stat span{font-size:12px;color:var(--muted)}
.struct{display:flex;flex-wrap:wrap;gap:10px}
.struct>div{flex:1 1 220px;background:var(--bg2);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.struct h4{margin:0;font-size:13px}
.struct .row{font-size:13px;color:var(--muted)}
.struct input.txt{width:56px;min-height:32px;padding:4px 8px;text-align:center}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pc{border:2px solid var(--line);border-radius:14px;padding:14px;background:var(--card);cursor:pointer;text-align:start;color:var(--ink);transition:.15s;display:flex;flex-direction:column;gap:4px}
.pc:hover{border-color:var(--accent)}
.pc.on{border-color:var(--accent);background:var(--accent-soft)}
.pc b{font-size:16px}.pc span{font-size:12.5px;color:var(--muted)}
details>summary{cursor:pointer;list-style:none;font-weight:600;font-size:13.5px;color:var(--accent);padding:2px 0}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";display:inline-block;transition:.15s}
details[open]>summary::before{content:"▾ "}
.sub{border:1px solid var(--line2);border-radius:12px;padding:4px 12px;background:var(--card)}
.sloi{display:grid;grid-template-columns:44px 1fr;gap:4px 10px;padding:8px 0;border-top:1px solid var(--line2);align-items:start}
.sloi:first-of-type{border-top:none}
.sloi .id{font-weight:700;font-size:13px;padding-top:6px}
.sloi .ur{font-size:15px;line-height:2}
.sloi .pills{grid-column:2}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tile{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.tile.writing{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tile h5{margin:0;font-size:13.5px;line-height:1.3}
.bar{height:6px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.spin{width:14px;height:14px;border:2px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.live{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--muted);background:var(--bg2);border-radius:10px;padding:10px;max-height:110px;overflow:hidden;white-space:pre-wrap;word-break:break-all;direction:ltr;text-align:left}
.qc{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--card);transition:.15s}
.qc:hover{border-color:var(--accent)}
.qc.pend{background:var(--bg2);border-style:dashed}
.qh{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.qn{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.qen{font-weight:600;font-size:15px}
.qur{font-size:17px}
.opts2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px}
.o2{border:1px solid var(--line2);border-radius:10px;padding:6px 10px;font-size:13.5px;overflow-wrap:anywhere}
.o2.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:600}
.o2 b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--bg2);color:var(--muted);font-size:11.5px;margin-inline-end:6px}
.o2.ok b{background:var(--ok);color:#fff}
.o2 .ur{display:block;font-size:15px}
.ans{font-size:13px;color:var(--muted);background:var(--bg2);border-radius:10px;padding:8px 12px}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:4px;border-top:1px solid var(--line2)}
.tools .mv{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.tools .mv input{width:48px;min-height:32px;padding:3px 6px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#16211c;color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;box-shadow:0 8px 28px rgba(0,0,0,.3);z-index:20;display:flex;gap:14px;align-items:center;max-width:calc(100vw - 32px);animation:fade .2s}
.toast button{background:none;border:none;color:#7fe0bf;font-weight:700;cursor:pointer;font-size:14px}
.sheetbox{border:1px solid var(--line);border-radius:12px;background:#8d8d86;padding:14px;overflow-x:auto}
.sheet{background:var(--sheet);color:var(--sheet-ink);width:794px;max-width:none;margin:0 auto 14px;padding:38px 42px;font-family:"Times New Roman",Times,serif;font-size:13.5px;line-height:1.35;box-shadow:0 1px 6px rgba(0,0,0,.35)}
.sheet h4{margin:0;text-align:center;font-size:19px}
.sheet .ins{direction:rtl;text-align:center;font-family:var(--ur);font-weight:600;font-size:13px;line-height:2;margin:6px 0 10px}
.sheet .q{margin-top:12px}.sheet .q .en{font-weight:700}
.sheet .q .u{font-family:var(--ur);direction:rtl;font-weight:600;line-height:2;font-size:13px}
.sheet .opts{display:grid;grid-template-columns:1fr 1fr;gap:1px 12px}
.sheet .o{display:grid;grid-template-columns:26px 1fr 1fr;gap:4px;align-items:start}
.sheet .o .u{font-weight:400;font-family:var(--ur);direction:rtl;text-align:left;font-size:12.5px;line-height:1.9}
.sheet .ln{border-bottom:1px solid var(--sheet-line);height:23px}
.log{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px;max-height:160px;overflow:auto}
footer{font-size:12px;color:var(--muted);line-height:1.7;padding:6px 2px}
@media (max-width:560px){.hero h1{font-size:25px}.ch .s{display:none}.cb{padding:2px 14px 16px}}
.tk{color:var(--k);font-weight:700}.tu{color:var(--u);font-weight:700}.ta{color:var(--a);font-weight:700}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.grip{cursor:grab;color:var(--muted);font-size:20px;line-height:1;padding:2px 4px;user-select:none;border-radius:6px}
.grip:hover{background:var(--bg2);color:var(--accent)}
.qc.dragging{opacity:.45}.qc.over{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.qc textarea.txt,.qc input.txt{width:100%}
.tile h5{font-weight:700}
.ch:focus-visible,.st:focus-visible,.btn:focus-visible,.pc:focus-visible,.seg button:focus-visible{outline:3px solid var(--accent-soft);outline-offset:1px}
.card.open{border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ev{font-size:13px;color:var(--muted);margin-top:6px}.ev summary{cursor:pointer}
</style>

async function testClaude(){
  S.test={st:'run',steps:[]};render();

  function step(name,st,detail){if(STANDALONE){name=String(name).replace(/Claude/g,'AI');detail=String(detail||'').replace(/Claude object present: no · /,'').replace(/Claude/g,'the AI')}T.steps.push({name:name,st:st,detail:detail||''});render()}
  var inFrame=false;try{inFrame=window.top!==window}catch(e){inFrame=true}
  step('Where the page is running','ok','inside a frame: '+(inFrame?'yes':'no')+' \u00b7 Claude object present: '+(window.claude?'yes':'no')+' \u00b7 address: '+location.hostname);
  var hint=setTimeout(function(){if(T.st==='run'&&!STANDALONE){T.hint='Still waiting. A permission box from Claude may be open (look at the top of the window or in the app) \u2014 choose Allow. If nothing appears at all, Claude calls are not reaching this view.';render()}},15000);
  var tu=Date.now(),sample=await getSample();
  if(!sample){clearTimeout(hint);step('Claude connection','bad','Claude did not answer the page after '+((Date.now()-tu)/1000).toFixed(1)+' s ("sample" capability not available). This usually means the page is opened as a plain web page, in a preview, or in a view where Claude calls are switched off. Open the artifact inside the claude.ai website or the Claude app while signed in.');T.st='bad';render();return}
  step('Claude capability found','ok','the page can ask Claude \u2014 now asking a one-line question');
  var lim=null;try{lim=await sample.limits()}catch(e){}
  S.gen.ctls=[];
  try{
    var r=await askClaude('Reply with exactly this JSON and nothing else: {"ok":true}');clearTimeout(hint);T.hint='';
    step('Claude answers','ok',((Date.now()-t0)/1000).toFixed(1)+' s'+(lim&&lim.images?' · can read page images':' · cannot read page images here'));
  }catch(e){clearTimeout(hint);T.hint='';var ei=errInfo(e);step('Claude answers','bad',ei.code+': '+ei.msg+(ei.raw&&ei.raw!==ei.msg?' ['+ei.raw.slice(0,160)+']':''));T.st='bad';render();return}
  if(!S.fw){T.st='ok';render();return}
  var t1=Date.now(),slo=S.fw.slos.filter(function(s){return s.types.mcq})[0],lv=sloLevelsOrDefault(slo)[0];
  var tmp={sid:'T',type:'mcq',unit:slo.subNo,slo:slo.id,level:lv,q:null,st:''},seen={},chars=0;
  try{
    var rr=await askClaude(slotsPrompt([tmp],[]),function(t){chars=t.length;applyReply([tmp],t,seen)});
    if(rr&&rr.text)applyReply([tmp],rr.text,seen);
    if(tmp.q)step('Writes a real question (SLO '+slo.id+')','ok',((Date.now()-t1)/1000).toFixed(1)+' s · reply '+chars+' characters · parsed correctly');
    else{step('Writes a real question (SLO '+slo.id+')','bad','Claude replied ('+chars+' characters) but the reply could not be read as a question. Reply began: '+String((rr&&rr.text)||'').slice(0,200));T.st='bad';render();return}
  }catch(e){var e2=errInfo(e);step('Writes a real question','bad',e2.code+': '+e2.msg+(e2.raw&&e2.raw!==e2.msg?' ['+e2.raw.slice(0,160)+']':''));T.st='bad';render();return}
  T.sample=tmp.q;T.st='ok';S.connected=true;render()}

  if(id==='fFw'){await loadFramework(f);t.value='';return}
  if(id==='fBook'){if(f)await loadBook(f);return}
  if(id==='sFwSheet'){setFramework(S.fwSheets,S.fwSrc,+t.value);render();return}
  var sm=/^sp([AM])_(srq|crq)$/.exec(id);
  if(sm){var val=parseInt(t.value,10);if(val>0){if(sm[1]==='A')S.spec[sm[2]].att=Math.min(val,S.spec[sm[2]].n);else S.spec[sm[2]].marks=val;
      var lbl=S.fw.tos[S.tosIdx]&&S.fw.tos[S.tosIdx].label; // papers already drafted from this TOS follow the new marks / attempt count
      (S.papers||[]).forEach(function(P){if(P.tos===lbl){P.spec[sm[2]].att=Math.min(S.spec[sm[2]].att,P.spec[sm[2]].n);P.spec[sm[2]].marks=S.spec[sm[2]].marks}})}render();return}
  if(id==='instr'){S.instr=t.value;saveStore();return}
  if(id==='custom'){S.custom=t.value;saveStore();render();return}
  if(id==='tier'){S.tier=t.value;saveStore();render();return}
  if(id==='aisvc'){AI.svc=t.value;AI.err='';AI.info='';S.test=null;S.connected=false;aiSave();render();return}
  if(id==='aimodel'){AI.info='';AI.models[AI.svc]=t.value;S.test=null;S.connected=false;aiSave();render();return}
  if(id==='aikey'){AI.keys[AI.svc]=t.value.trim();aiSave();return}
  if(id==='strict'||id==='easy'){S[id]=t.checked;saveStore();render();return}
  if(id==='nobook'){S.noBook=t.checked;render();return}
  if(id==='peekN'){var pn=parseInt(t.value,10);if(pn>0)S.peek=Math.min(BOOK.pages.length,pn);render();return}
  if(id==='ocrF'){S.ocrFrom=parseInt(t.value,10)||1;return}
  if(id==='ocrT'){S.ocrTo=parseInt(t.value,10)||0;return}
  var rm=/^r([ft])_(\d+)$/.exec(id);
  if(rm){var u=+rm[2];S.range[u]=S.range[u]||{};var rv=parseInt(t.value,10);if(rv>0)S.range[u][rm[1]]=rv;else delete S.range[u][rm[1]];MATCH_CACHE={};render();return}
  var mv=/^mv_(S\d+)$/.exec(id);
  if(mv&&S.cur){var to=parseInt(t.value,10);if(to>0)moveSlot(S.cur,mv[1],to-1);render();return}
  if(id==='nVer'){var nn=parseInt(t.value,10);S.nVer=Math.max(1,Math.min(15,nn||1));render();return}
  if(id==='sv'){S.startVer=t.value;var base=parseInt(t.value,10);if(base&&S.papers)S.papers.forEach(function(p,i){p.ver=String(base+i)});render()}});
document.addEventListener('input',function(ev){
  if(ev.target.id==='custom'){S.custom=ev.target.value;saveStore()}
  if(ev.target.classList&&ev.target.classList.contains('sumin')){var PP=S.papers[Math.min(S.sumVer||0,S.papers.length-1)],ll=PP&&slotLoc(PP,ev.target.dataset.sid);if(ll&&ll.s.q){ll.s.q[ev.target.dataset.f]=ev.target.value;var ch=$('#sumChecks');if(ch)ch.innerHTML=sumChecksHtml(PP)}}
  if(ev.target.id==='poff'){S.pageOff=parseInt(ev.target.value,10)||0;var PQ=S.papers[Math.min(S.sumVer||0,S.papers.length-1)];if(PQ){var tb=$('#sumTables');if(tb)tb.innerHTML=sumTablesHtml(PQ);var c2=$('#sumChecks');if(c2)c2.innerHTML=sumChecksHtml(PQ)}}
  if(ev.target.id==='sloQ'){S.sloQ=ev.target.value;var l=$('#sloList');if(l)l.innerHTML=sloListHtml()}});
document.addEventListener('toggle',function(e){
  var d=e.target;if(!d||d.tagName!=='DETAILS')return;
  if(d.dataset.k){S.dopen=S.dopen||{};S.dopen[d.dataset.k]=d.open}
  else if(d.dataset.unit){S.sloOpen[d.dataset.unit]=d.open}},true);

/* ---- drag & drop: files anywhere, and reordering questions ---- */
function hasFiles(e){var t=e.dataTransfer&&e.dataTransfer.types;return t&&Array.prototype.indexOf.call(t,'Files')>=0}
document.addEventListener('pointerdown',function(e){if(e.target.closest&&e.target.closest('[data-grip]'))S.pressing=true},true);
document.addEventListener('pointerup',function(){S.pressing=false},true);
document.addEventListener('dragstart',function(e){
  var g=e.target.closest&&e.target.closest('[data-grip]');if(!g)return;
  S.drag=g.dataset.grip;try{e.dataTransfer.setData('text/plain',S.drag);e.dataTransfer.effectAllowed='move'}catch(x){}
  var c=g.closest('.qc');if(c)c.classList.add('dragging')});
document.addEventListener('dragover',function(e){
  if(S.drag){var c=e.target.closest('.qc'),l=slotLoc(S.cur,S.drag);
    document.querySelectorAll('.qc.over').forEach(function(x){x.classList.remove('over')});
    if(c&&l&&c.dataset.t===l.t){e.preventDefault();c.classList.add('over')}return}
  if(hasFiles(e)){e.preventDefault();var z=e.target.closest('.drop');document.querySelectorAll('.drop.hot').forEach(function(x){x.classList.remove('hot')});if(z)z.classList.add('hot')}});
document.addEventListener('drop',function(e){
  if(S.drag){var c=e.target.closest('.qc');
    if(c){e.preventDefault();var to=slotLoc(S.cur,c.dataset.sid),from=slotLoc(S.cur,S.drag);if(to&&from&&to.t===from.t&&to.s!==from.s)moveSlot(S.cur,S.drag,to.i)}
    S.drag=null;render();return}
  if(hasFiles(e)){e.preventDefault();document.querySelectorAll('.drop.hot').forEach(function(x){x.classList.remove('hot')});
    var fl=e.dataTransfer.files;if(fl&&fl[0])onFile(fl[0])}});
document.addEventListener('dragend',function(){S.drag=null;S.pressing=false;document.querySelectorAll('.qc.over,.qc.dragging').forEach(function(x){x.classList.remove('over');x.classList.remove('dragging')})});

window.__PM={pageFixed:pageFixed,groundCheck:groundCheck,bookOn:bookOn,buildSummary:buildSummary,verifySummary:verifySummary,summaryRows:summaryRows,sumChecks:sumChecks,S:S,get BOOK(){return BOOK},render:render,planSlots:planSlots,specFromTos:specFromTos,insFor:insFor,paperData:paperData,slotsPrompt:slotsPrompt,extractItems:extractItems,matchPages:matchPages,evalBook:evalBook,errInfo:errInfo,makeJobs:makeJobs};
loadStore();aiLoad();render();

})();
</script>
